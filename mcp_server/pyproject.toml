[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anan-mcp-server"
version = "0.1.0"
description = "MCP server for UFW control via a local HTTPS helper agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.138.1",
  "fastmcp>=3.4.2",
  "pydantic>=2.11.7",
  "uvicorn[standard]>=0.49.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
